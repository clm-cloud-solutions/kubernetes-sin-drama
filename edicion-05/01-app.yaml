# Edición 5 · Un Deployment cuyo readiness depende de un archivo.
# Si /tmp/listo existe, el pod está Ready. Si no, la sonda falla
# con el mismo mensaje cada vez, y el kubelet lo agrupa en un solo evento.
apiVersion: v1
kind: Namespace
metadata:
  name: ksd-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: ksd-05
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "touch /tmp/listo; while true; do sleep 3600; done"]
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/listo"]
            periodSeconds: 10
            failureThreshold: 1
